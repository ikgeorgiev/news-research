name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=20

      - name: Run reporting and receiver tests
        working-directory: .
        run: python -m pytest -q tools/tests

  backend-postgres:
    name: Backend Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cef_study_disposable
          POSTGRES_USER: cef_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cef_test -d cef_study_disposable"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://cef_test:postgres@127.0.0.1:5432/cef_study_disposable
      CEF_DISPOSABLE_TEST_URL: postgresql+psycopg://cef_test:postgres@127.0.0.1:5432/cef_study_disposable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        run: python migrate.py

      - name: Run Postgres integration tests
        run: >-
          pytest -q tests/test_postgres_ci.py tests/test_postgres_ingestion_latency.py
          tests/test_article_enrichment.py tests/test_fc_postgres.py
          tests/test_page_access.py tests/test_source_scheduler_postgres.py
          tests/test_ingestion_runtime_sync.py::test_postgres_prune_retains_row_attached_while_waiting_for_lock

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run browser bridge unit tests
        working-directory: .
        run: node --test tools/tests/test_*.cjs

      - name: Run frontend build
        run: npm run build
